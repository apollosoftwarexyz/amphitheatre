name: amphitheatre
description: "A Flutter video player and editor."
version: 0.0.3
homepage: https://github.com/apollosoftwarexyz/amphitheatre

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: '>=0.19.0 <0.21.0'

  video_player: ^2.11.1
  flutter_svg: ^2.1.0
  plugin_platform_interface: ^2.0.2
  cross_file: ^0.3.5+4

dev_dependencies:
  flutter_test:
    sdk: flutter

  test: ^1.30.0
  flutter_lints: ^6.0.0

flutter:
  generate: true

  assets:
    - assets/crop_start.svg
    - assets/crop_end.svg

  plugin:
    platforms:
      android:
        package: xyz.apollosoftware.amphitheatre
        pluginClass: AmphitheatrePlugin
      ios:
        pluginClass: AmphitheatrePlugin
