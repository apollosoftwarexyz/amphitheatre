import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

group = "xyz.apollosoftware.amphitheatre"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.4.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

kotlin {
    compilerOptions {
        languageVersion = KotlinVersion.fromVersion(kotlin_version)
        jvmTarget = JvmTarget.fromTarget("1.8")
    }
}

android {
    namespace = "xyz.apollosoftware.amphitheatre"

    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }

    dependencies {
        implementation("androidx.media3:media3-transformer:1.11.1")
        implementation("androidx.media3:media3-effect:1.11.1")

        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")

        // TODO: remove
//        implementation(files("/Users/samjakob/development/flutter/bin/cache/artifacts/engine/android-arm64-release/flutter.jar"))

        testImplementation(platform("org.junit:junit-bom:6.1.3"))
        testImplementation("org.junit.jupiter:junit-jupiter")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.24.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
